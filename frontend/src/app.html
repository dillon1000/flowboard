<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Flowboard is a focused workspace for planning and shipping work." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/webp" href="%sveltekit.assets%/focalboard-fb-abbreviation-tp.webp" />
    <script>
      try {
        const savedTheme = localStorage.getItem('flowboard-theme');
        document.documentElement.dataset.theme =
          savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.sidebar =
          localStorage.getItem('flowboard-sidebar') === 'collapsed' ? 'collapsed' : 'expanded';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
