name: Docker

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Buildx gives pull requests and main the same multi-stage Docker build.
      # The workflow keeps build layers in GitHub's cache but does not publish
      # an image or request package write access.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: flowboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
