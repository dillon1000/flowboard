name: Docker

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Buildx gives pull requests and main the same multi-stage Docker build.
      # The workflow keeps build layers in GitHub's cache but does not publish
      # an image or request package write access.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: flowboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Development mode uses an HTTP-compatible session cookie and applies
      # migrations at startup. The loop gives a cold Vapor process time to bind.
      - name: Smoke test container
        shell: bash
        run: |
          docker run --detach --name flowboard-smoke \
            --publish 18080:8080 \
            flowboard:test \
            serve --env development --hostname 0.0.0.0 --port 8080

          trap 'docker logs flowboard-smoke; docker rm --force flowboard-smoke' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18080/health > /dev/null
          curl --fail --silent http://127.0.0.1:18080/register \
            | grep --quiet '<title>Create account · Flowboard</title>'
